name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: xiaoyi-daily
        run: npm install
      - name: Generate Prisma Client
        working-directory: xiaoyi-daily
        run: npx prisma generate
      - name: Build
        working-directory: xiaoyi-daily
        run: npx next build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Deploy
        working-directory: xiaoyi-daily
        run: vercel . --prod --yes --token=${{ secrets.VERCEL_TOKEN }} --env DATABASE_URL="${{ secrets.DATABASE_URL }}" --env DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}"
