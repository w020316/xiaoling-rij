name: Deploy Love Daily to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: xiaoyi-daily/package-lock.json

      - name: Install dependencies
        working-directory: xiaoyi-daily
        run: npm ci

      - name: Generate Prisma Client
        working-directory: xiaoyi-daily
        run: npx prisma generate

      - name: Build Next.js
        working-directory: xiaoyi-daily
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Deploy to Vercel
        working-directory: xiaoyi-daily
        run: vercel . --prod --yes --token=${{ secrets.VERCEL_TOKEN }} --env DATABASE_URL="${{ secrets.DATABASE_URL }}" --env DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}"
