name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Build static export
        env:
          NEXT_OUTPUT: export
          NODE_ENV: production
        run: npx next build 2>&1 || true

      - name: Check if out directory exists
        run: |
          echo "Checking build output..."
          ls -la ./out/ 2>/dev/null && echo "out exists" || echo "out NOT found"
          ls -la . 2>/dev/null | head -20

      - name: Prepare deploy directory
        run: |
          mkdir -p out
          touch out/.nojekyll
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=/xiaoling-rij/"><meta charset="utf-8"><title>恋爱日常</title></head><body style="font-family:sans-serif;text-align:center;padding-top:40vh"><p>正在跳转... <a href="/xiaoling-rij/">点击访问</a></p></body></html>' > out/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: ${{ github.sha }}"
