name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Prepare for static export
        run: |
          rm -rf src/app/_api_backup src/app/_diary_id_backup
          mv src/app/api src/app/_api_backup || true
          mv "src/app/diary/[id]" "src/app/_diary_id_backup" || true
          rm -rf .next

      - name: Build static export
        env:
          NEXT_OUTPUT: export
          NODE_ENV: production
        run: npx next build 2>&1

      - name: Restore excluded routes
        run: |
          mv src/app/_api_backup src/app/api || true
          mv "src/app/_diary_id_backup" "src/app/diary/[id]" || true

      - name: Verify output
        run: |
          echo "=== Output structure ==="
          find ./out/xiaoling-rij -type f | head -40
          echo ""
          echo "=== Total files ==="
          find ./out/xiaoling-rij -type f | wc -l

      - name: Deploy preparation
        run: |
          touch out/.nojekyll
          cat > out/index.html << 'EOF'
<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=/xiaoling-rij/"><title>恋爱日常</title></head>
<body style="font-family:sans-serif;text-align:center;padding-top:40vh;color:#6b7280">
<p>正在跳转到恋爱日常...</p>
<p style="margin-top:12px"><a href="/xiaoling-rij/" style="color:#a855f7">点击访问</a></p>
</body></html>
EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: v${{ github.sha }}"
