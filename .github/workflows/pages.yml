name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Prepare for static export
        run: |
          rm -rf src/app/_api_backup src/app/_diary_id_backup
          mv src/app/api src/app/_api_backup || true
          mv "src/app/diary/[id]" "src/app/_diary_id_backup" || true
          rm -rf .next

      - name: Build static export
        env:
          NEXT_OUTPUT: export
          NODE_ENV: production
        run: npx next build 2>&1

      - name: Restore excluded routes
        run: |
          mv src/app/_api_backup src/app/api || true
          mv "src/app/_diary_id_backup" "src/app/diary/[id]" || true

      - name: Verify output & prepare for GitHub Pages
        run: |
          echo "=== Output structure ==="
          ls out/
          echo ""
          echo "=== Key files ==="
          ls out/*.html 2>/dev/null | head -5
          ls out/_next/ 2>/dev/null | head -5
          echo ""
          echo "=== Total files ==="
          find ./out -type f | wc -l

          touch out/.nojekyll
          cp out/index.html out/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: v${{ github.sha }}"
